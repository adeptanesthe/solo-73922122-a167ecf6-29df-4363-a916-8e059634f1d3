services:
  eq-api:
    build: .
    image: theatre-eq-api:latest
    container_name: theatre-eq-api
    ports:
      - "8000:8000"
    environment:
      # SLSQP works on tiny dense systems; a single BLAS thread avoids
      # multi-threaded overhead (seconds instead of milliseconds here).
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
